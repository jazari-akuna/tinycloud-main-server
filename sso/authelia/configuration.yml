# Authelia: one sign-in for every site behind the proxy.
# No secrets live here: they are read from /data on the server (see ../README.md).
server:
  address: 'tcp://:9091'
log:
  level: 'info'
theme: 'auto'
totp:
  issuer: 'raph.io'
authentication_backend:
  password_reset:
    disable: true
  file:
    path: '/data/users.yml'
    watch: true
    password:
      algorithm: 'argon2'
access_control:
  default_policy: 'deny'
  rules:
    # Short links stay public; only the admin area needs a sign-in.
    - domain: 's.raph.io'
      resources: ['^/admin([/?].*)?$']
      subject: 'group:admins'
      policy: 'one_factor'
    - domain: 's.raph.io'
      policy: 'bypass'
    # n8n webhooks and forms are called by other services.
    - domain: 'n8n-alex.raph.io'
      resources: ['^/(webhook|webhook-test|webhook-waiting|form|form-test|form-waiting)/.*']
      policy: 'bypass'
    # Portainer's git webhooks.
    - domain: ['p.raph.io', 'portainer.numbers-labs.com']
      resources: ['^/api/(stacks/)?webhooks/.*']
      policy: 'bypass'
    # The hub's API checks its own tokens (agents and the hub command).
    - domain: 'hub.raph.io'
      resources: ['^/api/v1/.*']
      policy: 'bypass'
    - domain: ['*.raph.io', '*.numbers-labs.com']
      subject: 'group:admins'
      policy: 'one_factor'
session:
  cookies:
    - domain: 'raph.io'
      authelia_url: 'https://auth.raph.io'
      default_redirection_url: 'https://c.raph.io'
    - domain: 'numbers-labs.com'
      authelia_url: 'https://auth.numbers-labs.com'
  expiration: '12h'
  inactivity: '4h'
  remember_me: '1M'
regulation:
  max_retries: 5
  find_time: '10m'
  ban_time: '1h'
storage:
  local:
    path: '/data/db.sqlite3'
notifier:
  filesystem:
    filename: '/data/notification.txt'
identity_providers:
  oidc:
    jwks:
      - key: {{ secret "/data/secrets/oidc.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'nextcloud'
        client_name: 'Nextcloud'
        client_secret: {{ secret "/data/secrets/client-nextcloud.hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        require_pkce: false
        redirect_uris:
          - 'https://c.raph.io/apps/user_oidc/code'
          - 'https://cloud.numbers-labs.com/apps/user_oidc/code'
          - 'https://cloud.numberslabs.com/apps/user_oidc/code'
        scopes: ['openid', 'profile', 'email', 'groups']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
      - client_id: 'jellyfin'
        client_name: 'Jellyfin'
        client_secret: {{ secret "/data/secrets/client-jellyfin.hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        require_pkce: false
        redirect_uris:
          - 'https://stream.raph.io/sso/OID/redirect/authelia'
          - 'https://stream.numbers-labs.com/sso/OID/redirect/authelia'
        scopes: ['openid', 'profile', 'groups']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
      - client_id: 'portainer'
        client_name: 'Portainer'
        client_secret: {{ secret "/data/secrets/client-portainer.hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        redirect_uris: ['https://p.raph.io', 'https://portainer.numbers-labs.com']
        scopes: ['openid', 'profile', 'groups', 'email']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
