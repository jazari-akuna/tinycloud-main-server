# Jellyfin: the only ways in are the SSO sign-in below, or a Quick Connect code
# approved by someone already signed in. Password logins are refused here.
location ~* ^/+((emby|mediabrowser)/+)?users/+(([^/]+/+)?authenticate(byname)?|forgotpassword(/+pin)?)/?$ {
    default_type application/json;
    return 403 '{"error":"Password sign-in is switched off. Open https://stream.raph.io to sign in with SSO, or use Quick Connect in the app."}';
}
location = /sso-login {
    set $jellyfin_sso http://jellyfin-sso:8080;
    proxy_pass $jellyfin_sso;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
