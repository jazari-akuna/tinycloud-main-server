# Adds a small script to the app's pages so it signs in on its own (portainer.js or npm.js).
# deploy.sh replaces SCRIPT with the file name. The script files live in /data/nginx/custom/sso/.
more_clear_input_headers Accept-Encoding;
sub_filter '</head>' '<script src="/__sso/SCRIPT"></script></head>';
sub_filter_once on;
location = /__sso/SCRIPT {
    alias /data/nginx/custom/sso/SCRIPT;
    default_type application/javascript;
    add_header Cache-Control "no-store";
}
